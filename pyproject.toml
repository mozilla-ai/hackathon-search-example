[project]
name = "search-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "any-agent[all]",
    "any-llm-sdk[all]",
    # any-agent 1.18.0 declares an unbounded "mcp>=1.5.0", but imports
    # mcp.client.streamable_http.streamablehttp_client, a deprecated alias that
    # mcp 2.x removed. Without this bound, `import any_agent` fails outright.
    "mcp<2",
]
